spring.application.name=notificationservice
server.port=${SERVER_PORT:8086}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=emailService
spring.kafka.consumer.auto-offset-reset=earliest

# Email delivery. Disabled by default: messages are logged instead of sent.
# Works with any SMTP server, e.g. Gmail (app password) or Amazon SES SMTP (email-smtp.<region>.amazonaws.com).
notification.email.enabled=${EMAIL_ENABLED:false}
notification.email.from=${MAIL_FROM:no-reply@capstone-shop.local}
notification.smtp.host=${SMTP_HOST:smtp.gmail.com}
notification.smtp.port=${SMTP_PORT:587}
# Credentials must come from the environment; never commit them
notification.smtp.username=${SMTP_USERNAME:}
notification.smtp.password=${SMTP_PASSWORD:}
