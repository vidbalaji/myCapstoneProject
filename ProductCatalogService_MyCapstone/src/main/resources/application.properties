spring.application.name=productservice
server.port=${SERVER_PORT:8082}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/productservice_aug2026?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}

# AWS RDS example (see deployment notes):
#spring.datasource.url=jdbc:mysql://<rds-endpoint>.ap-south-1.rds.amazonaws.com:3306/pcs

eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Elasticsearch powers /search (full text + typo tolerance). When disabled, search falls back to MySQL LIKE queries.
app.search.elasticsearch.enabled=${ELASTICSEARCH_ENABLED:false}
spring.elasticsearch.uris=${ELASTICSEARCH_URIS:http://localhost:9200}
# Repositories are switched on by ElasticsearchConfig only when the flag above is true
spring.data.elasticsearch.repositories.enabled=false
