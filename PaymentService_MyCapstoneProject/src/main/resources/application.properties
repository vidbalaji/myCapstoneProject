spring.application.name=paymentservice
server.port=${SERVER_PORT:8085}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/paymentservice_aug2026?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=paymentservice
spring.kafka.consumer.auto-offset-reset=earliest

eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Which gateway creates payment links: STRIPE, RAZORPAY or MOCK (MOCK needs no account, for local runs and demos)
payment.gateway=${PAYMENT_GATEWAY:MOCK}
payment.currency=${PAYMENT_CURRENCY:INR}
# Public URL of the API Gateway, used to build mock payment links and the post-payment redirect
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}

# Gateway credentials: never commit real values, set them as environment variables
razorpay.key.id=${RAZORPAY_KEY_ID:id}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:secret}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}
stripe.apiKey=${STRIPE_API_KEY:apikey}
stripe.webhookSecret=${STRIPE_WEBHOOK_SECRET:}
