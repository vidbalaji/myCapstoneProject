spring.application.name=cartservice
server.port=${SERVER_PORT:8083}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/cartservice}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# redis = read carts from Redis first (cache-aside); none = always read MongoDB (used for benchmarking)
spring.cache.type=${CART_CACHE_TYPE:redis}
app.cart.cache-ttl-minutes=30

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

app.cart.max-quantity-per-item=10
