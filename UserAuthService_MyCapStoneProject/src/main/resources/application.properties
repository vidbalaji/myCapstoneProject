spring.application.name=userservice
server.port=${SERVER_PORT:8081}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/userservice_aug2026?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}

eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# JWT signing key (Base64, at least 256 bits). Override JWT_SECRET in every real environment.
jwt.secret=${JWT_SECRET:c2NhbGVyLWNhcHN0b25lLWVjb21tZXJjZS1kZXYtb25seS1zZWNyZXQta2V5LTI1Ng==}
jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:1440}

app.email.from=${MAIL_FROM:no-reply@capstone-shop.local}
app.frontend-url=${FRONTEND_URL:http://localhost:8080}
app.password-reset.expiry-minutes=15
# Users signing up with one of these emails also get the ADMIN role
app.admin-emails=${ADMIN_EMAILS:admin@capstone-shop.local}
