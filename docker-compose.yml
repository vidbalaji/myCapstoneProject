# Full stack for local runs and demos: infrastructure + all microservices.
#   ./build-all.sh            # builds every service jar
#   docker compose up -d --build
# Entry point for clients: http://localhost:8080 (API Gateway). Eureka dashboard: http://localhost:8761

x-java-build: &java-build
  args:
    BASE_IMAGE: ${JAVA_BASE_IMAGE:-eclipse-temurin:17-jre}

x-service-env: &service-env
  EUREKA_URL: http://discovery:8761/eureka/
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  DB_USERNAME: root
  DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-12345}
  JAVA_TOOL_OPTIONS: -Xss512k

x-depends-on-core: &depends-on-core
  discovery:
    condition: service_started
  kafka:
    condition: service_healthy

services:
  # ---------- infrastructure ----------
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-12345}
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-12345}"]
      interval: 5s
      retries: 30

  mongodb:
    image: mongo:7.0
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]

  redis:
    image: redis:7.2-alpine
    ports: ["6379:6379"]

  kafka:
    image: apache/kafka:3.8.0
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      retries: 20

  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE:-elasticsearch:8.15.3}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      # dev only: a nearly full laptop disk must not make the single node refuse to allocate shards
      cluster.routing.allocation.disk.threshold_enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      retries: 30

  # ---------- microservices ----------
  discovery:
    build: { context: ./ServiceDiscovery_MyCapstoneproject, <<: *java-build }
    ports: ["8761:8761"]

  gateway:
    build: { context: ./ApiGateway_MyCapstoneProject, <<: *java-build }
    ports: ["8080:8080"]
    environment:
      <<: *service-env
      REDIS_HOST: redis
      RATE_LIMIT_PER_SECOND: ${RATE_LIMIT_PER_SECOND:-20}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-40}
      AUTH_CACHE_TTL_SECONDS: ${AUTH_CACHE_TTL_SECONDS:-60}
    depends_on:
      discovery: { condition: service_started }
      redis: { condition: service_started }

  userservice:
    build: { context: ./UserAuthService_MyCapStoneProject, <<: *java-build }
    ports: ["8081:8081"]
    environment:
      <<: *service-env
      DB_URL: jdbc:mysql://mysql:3306/userservice_aug2026?createDatabaseIfNotExist=true
      JWT_SECRET: ${JWT_SECRET:-c2NhbGVyLWNhcHN0b25lLWVjb21tZXJjZS1kZXYtb25seS1zZWNyZXQta2V5LTI1Ng==}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-admin@capstone-shop.local}
    depends_on:
      <<: *depends-on-core
      mysql: { condition: service_healthy }

  productservice:
    build: { context: ./ProductCatalogService_MyCapstone, <<: *java-build }
    ports: ["8082:8082"]
    environment:
      <<: *service-env
      DB_URL: jdbc:mysql://mysql:3306/productservice_aug2026?createDatabaseIfNotExist=true
      ELASTICSEARCH_ENABLED: ${ELASTICSEARCH_ENABLED:-true}
      ELASTICSEARCH_URIS: http://elasticsearch:9200
    depends_on:
      discovery: { condition: service_started }
      mysql: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }

  cartservice:
    build: { context: ./CartService_MyCapstoneProject, <<: *java-build }
    ports: ["8083:8083"]
    environment:
      <<: *service-env
      MONGODB_URI: mongodb://mongodb:27017/cartservice
      REDIS_HOST: redis
      CART_CACHE_TYPE: ${CART_CACHE_TYPE:-redis}
    depends_on:
      <<: *depends-on-core
      mongodb: { condition: service_started }
      redis: { condition: service_started }

  orderservice:
    build: { context: ./OrderService_MyCapstoneProject, <<: *java-build }
    ports: ["8084:8084"]
    environment:
      <<: *service-env
      DB_URL: jdbc:mysql://mysql:3306/orderservice_aug2026?createDatabaseIfNotExist=true
    depends_on:
      <<: *depends-on-core
      mysql: { condition: service_healthy }

  paymentservice:
    build: { context: ./PaymentService_MyCapstoneProject, <<: *java-build }
    ports: ["8085:8085"]
    environment:
      <<: *service-env
      DB_URL: jdbc:mysql://mysql:3306/paymentservice_aug2026?createDatabaseIfNotExist=true
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-MOCK}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    depends_on:
      <<: *depends-on-core
      mysql: { condition: service_healthy }

  notificationservice:
    build: { context: ./NotificationService_MyCapStoneProject, <<: *java-build }
    ports: ["8086:8086"]
    environment:
      <<: *service-env
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@capstone-shop.local}
    depends_on:
      kafka: { condition: service_healthy }

volumes:
  mysql-data:
  mongo-data:
